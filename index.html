<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Dashboard Laboral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>Mi dashboard</h1><p>Turnos del restaurante y ahorros</p></div>
    <button class="icon-btn" id="tema" aria-label="Cambiar tema claro u oscuro">◐</button>
  </div>

  <section class="hero" aria-label="Resumen de ganancias">
    <div>
      <small>Ganancia de esta semana</small>
      <div class="big num" id="semana">0,00 €</div>
      <div class="sub" id="semana-horas">0 horas trabajadas</div>
    </div>
    <div class="split">
      <small>Estado de cobros (total)</small>
      <div class="bar"><i class="b1" id="barPagado" style="width:0"></i><i class="b2" id="barPend" style="width:0"></i></div>
      <div class="legend">
        <div>Cobrado<b id="cobrado">0,00 €</b></div>
        <div style="text-align:right">Pendiente<b id="pendiente">0,00 €</b></div>
      </div>
    </div>
  </section>

  <section class="stats" aria-label="Estadísticas">
    <div class="stat"><span>Horas totales</span><b id="horas-total">0</b></div>
    <div class="stat"><span>Turnos</span><b id="n-turnos">0</b></div>
    <div class="stat"><span>Ahorro total</span><b id="ahorro-view">0,00 €</b></div>
    <div class="stat"><span>Ahorro + pendiente</span><b id="proyeccion">0,00 €</b></div>
  </section>

  <div class="grid">
    <div class="col">
      <section class="card">
        <h2>Nuevo turno</h2>
        <form id="form-turno">
          <div class="two">
            <div class="field"><label for="fecha-turno">Fecha</label><input type="date" id="fecha-turno" required></div>
            <div class="field"><label for="horas-turno">Horas</label><input type="number" id="horas-turno" step="0.5" min="0.5" placeholder="6" required></div>
          </div>
          <button type="submit" class="btn">Añadir turno</button>
        </form>
      </section>
      <section class="card">
        <h2>Ajustes</h2>
        <div class="field"><label for="precio-hora">Precio por hora (€)</label><input type="number" id="precio-hora" step="0.5" min="0" value="10"></div>
        <div class="field" style="margin-bottom:0"><label for="total-ahorrado">Ahorro total (€)</label><input type="number" id="total-ahorrado" step="10" min="0" value="0"></div>
      </section>
    </div>

    <div class="col">
      <section class="card">
        <h2>Esta semana, día a día</h2>
        <div class="chart" id="chart" role="img" aria-label="Ganancia por día de la semana actual"></div>
      </section>
      <section class="card">
        <div class="row">
          <h2>Turnos y pagos</h2>
          <div class="tabs" id="tabs">
            <button data-f="todos" aria-pressed="true">Todos</button>
            <button data-f="pend" aria-pressed="false">Pendientes</button>
            <button data-f="pag" aria-pressed="false">Pagados</button>
          </div>
        </div>
        <div id="lista"></div>
      </section>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
